name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if printf '%s' "$version" | grep -Eq -- '-(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package source
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git archive --format=tar.gz --prefix="aries-connect-$version/" \
            -o "aries-connect-$version.tar.gz" HEAD

      - name: Package binary
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          name="aries-connect-$version-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          install -Dm755 target/release/aries-connect "dist/$name/aries-connect"
          install -Dm644 README.md LICENSE -t "dist/$name"
          cp -r doc "dist/$name/doc"
          tar -C dist -czf "$name.tar.gz" "$name"

      - name: Checksums
        run: sha256sum aries-connect-*.tar.gz > SHA256SUMS

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            aries-connect-*.tar.gz
            SHA256SUMS

      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]:/) { exit }
            found { print }
          ' CHANGELOG.md | perl -0pe 's/\s+\z/\n/' > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for details." > notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(--title "AriesConnect $GITHUB_REF_NAME" --notes-file notes.md --verify-tag)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            aries-connect-*.tar.gz SHA256SUMS
