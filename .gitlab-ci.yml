# GitLab CI for AriesConnect.
#
# Mirrors .github/workflows/ci.yml and .github/workflows/release.yml.
# The GitHub workflows are kept intact (.github/) for reversibility; this
# file is the active CI while the project lives on GitLab.

stages:
  - check
  - build
  - release

variables:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

# Shared cache for cargo. Keyed by lockfile so a dependency change rebuilds.
cache:
  key:
    files:
      - Cargo.lock
  paths:
    - target/
    - .cargo/registry/
    - .cargo/git/

# ---------------------------------------------------------------------------
# Check stage: format, lint, tests.
# ---------------------------------------------------------------------------

fmt:
  stage: check
  image: rust:latest
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

clippy:
  stage: check
  image: rust:latest
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --locked -- -D warnings

test:
  stage: check
  image: rust:latest
  script:
    - cargo test --locked

# ---------------------------------------------------------------------------
# Build stage: release binary + packages (only on default branch and tags).
# ---------------------------------------------------------------------------

release-build:
  stage: build
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl build-essential pkg-config
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - . "$HOME/.cargo/env"
    - rustup component add rustfmt clippy
  script:
    - . "$HOME/.cargo/env"
    # Version check on tags, mirroring release.yml.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        version="${CI_COMMIT_TAG#v}"
        cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
        if [ "$version" != "$cargo_version" ]; then
          echo "tag $CI_COMMIT_TAG does not match Cargo.toml version $cargo_version" >&2
          exit 1
        fi
      fi
    - cargo test --locked
    - cargo build --release --locked
    # Package source and binary, mirroring release.yml.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        version="${CI_COMMIT_TAG#v}"
        git archive --format=tar.gz --prefix="aries-connect-$version/" \
          -o "aries-connect-$version.tar.gz" HEAD
        name="aries-connect-$version-x86_64-unknown-linux-gnu"
        mkdir -p "dist/$name"
        install -Dm755 target/release/aries-connect "dist/$name/aries-connect"
        install -Dm644 README.md LICENSE -t "dist/$name"
        cp -r doc "dist/$name/doc"
        cp -r contrib "dist/$name/contrib"
        tar -C dist -czf "$name.tar.gz" "$name"
        sha256sum aries-connect-*.tar.gz > SHA256SUMS
      fi
  artifacts:
    when: on_success
    expire_in: 30 days
    paths:
      - aries-connect-*.tar.gz
      - aries-connect-*-x86_64-unknown-linux-gnu.tar.gz
      - SHA256SUMS
      - target/release/aries-connect

# ---------------------------------------------------------------------------
# Release stage: publish a GitLab release on tag push.
# ---------------------------------------------------------------------------

gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - release-build
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      # Extract release notes from CHANGELOG.md, mirroring release.yml.
      awk -v header="## [$version]" '
        index($0, header) == 1 { found = 1; next }
        found && (/^## \[/ || /^\[[^]]+\]:/) { exit }
        found { print }
      ' CHANGELOG.md | perl -0pe 's/\s+\z/\n/' > notes.md
      if [ ! -s notes.md ]; then
        echo "See CHANGELOG.md for details." > notes.md
      fi
    - |
      prerelease=""
      if printf '%s' "$version" | grep -Eq -- '-(alpha|beta|rc)'; then
        prerelease="--prerelease"
      fi
    - |
      # glab reads GITLAB_TOKEN; fall back to the job token if no PAT is set.
      export GITLAB_TOKEN="${GITLAB_TOKEN:-$CI_JOB_TOKEN}"
      glab release create "$CI_COMMIT_TAG" \
        --title "AriesConnect $CI_COMMIT_TAG" \
        --notes-file notes.md \
        $prerelease \
        aries-connect-*.tar.gz SHA256SUMS
  dependencies:
    - release-build
