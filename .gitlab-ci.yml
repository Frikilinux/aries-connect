# GitLab CI for AriesConnect.
#
# Mirrors .github/workflows/ci.yml and .github/workflows/release.yml.
# The GitHub workflows are kept intact (.github/) for reversibility; this
# file is the active CI while the project lives on GitLab.

stages:
  - check
  - build
  - release

variables:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  # Keep Cargo's registry inside the project so GitLab can cache it.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

# Cache the Cargo registry (small, high value): avoids re-fetching the
# crates.io index and re-downloading crate sources on every run.
# target/ is intentionally not cached: it is large and the dev and release
# profiles would thrash the same key.
cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/

# ---------------------------------------------------------------------------
# Check stage: a single job reuses the dev-profile target/ directory across
# fmt, clippy and test instead of pulling and compiling in three parallel jobs.
# ---------------------------------------------------------------------------

check:
  stage: check
  image: rust:latest
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy --all-targets --locked -- -D warnings
    - cargo test --locked

# ---------------------------------------------------------------------------
# Build stage: release binary + packages (only on default branch and tags).
# Kept on Ubuntu 22.04 so the published binary targets that glibc.
# ---------------------------------------------------------------------------

release-build:
  stage: build
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git build-essential pkg-config
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - . "$CARGO_HOME/env"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        version="${CI_COMMIT_TAG#v}"
        cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
        if [ "$version" != "$cargo_version" ]; then
          echo "tag $CI_COMMIT_TAG does not match Cargo.toml version $cargo_version" >&2
          exit 1
        fi
      fi
    # Tests already run in the check job; here we only build the release.
    - cargo build --release --locked
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        version="${CI_COMMIT_TAG#v}"
        git archive --format=tar.gz --prefix="aries-connect-$version/" \
          -o "aries-connect-$version.tar.gz" HEAD
        name="aries-connect-$version-x86_64-unknown-linux-gnu"
        mkdir -p "dist/$name"
        install -Dm755 target/release/aries-connect "dist/$name/aries-connect"
        install -Dm644 README.md LICENSE -t "dist/$name"
        cp -r doc "dist/$name/doc"
        cp -r contrib "dist/$name/contrib"
        tar -C dist -czf "$name.tar.gz" "$name"
        sha256sum aries-connect-*.tar.gz > SHA256SUMS
      fi
  artifacts:
    when: on_success
    expire_in: 30 days
    paths:
      - aries-connect-*.tar.gz
      - aries-connect-*-x86_64-unknown-linux-gnu.tar.gz
      - SHA256SUMS
      - target/release/aries-connect

# ---------------------------------------------------------------------------
# Release stage: publish a GitLab release on tag push.
# glab authenticates with the CI job token via GLAB_ENABLE_CI_AUTOLOGIN, which
# uses the JOB-TOKEN header the Releases API accepts. Do not set
# GITLAB_TOKEN="$CI_JOB_TOKEN": that is sent as PRIVATE-TOKEN and fails.
# ---------------------------------------------------------------------------

gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - release-build
  cache: []
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      # Extract the release notes for this version from CHANGELOG.md.
      awk -v header="## [$version]" '
        index($0, header) == 1 { found = 1; next }
        found && (/^## \[/ || /^\[[^]]+\]:/) { exit }
        found { print }
      ' CHANGELOG.md > notes.md
      if [ ! -s notes.md ]; then
        echo "See CHANGELOG.md for details." > notes.md
      fi
    - |
      # Upload assets to the generic package registry: unlike /uploads, it
      # accepts the CI job token used by GLAB_ENABLE_CI_AUTOLOGIN.
      glab release create "$CI_COMMIT_TAG" \
        --name "AriesConnect $CI_COMMIT_TAG" \
        --notes-file notes.md \
        --use-package-registry \
        aries-connect-*.tar.gz SHA256SUMS
